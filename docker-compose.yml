services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bankup
      POSTGRES_PASSWORD: bankup_secret
      POSTGRES_DB: bankup_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bankup -d bankup_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
